<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMCS Labs – AppSec Intelligence Platform</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>

    <div class="app-shell">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <div class="brand-logo">DM</div>
                <div class="brand-text">
                    <div class="brand-title">DMCS Labs</div>
                    <div class="brand-subtitle">AppSec Intelligence</div>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-item">
                    <i class="bi bi-speedometer2"></i>
                    <span>Dashboard</span>
                </a>

                <a href="/findings" class="nav-item">
                    <i class="bi bi-bug"></i>
                    <span>Findings</span>
                </a>

                <a href="/assets" class="nav-item">
                    <i class="bi bi-hdd-network"></i>
                    <span>Assets</span>
                </a>

                <a href="/discovery" class="nav-item">
                    <i class="bi bi-broadcast-pin"></i>
                    <span>Discovery</span>
                </a>

                <a href="/threat-model" class="nav-item">
                    <i class="bi bi-diagram-3"></i>
                    <span>Threat Model</span>
                </a>

                <a href="/compliance" class="nav-item">
                    <i class="bi bi-shield-check"></i>
                    <span>Compliance</span>
                </a>

                <a href="/audit" class="nav-item">
                    <i class="bi bi-journal-text"></i>
                    <span>Audit</span>
                </a>

                <a href="/reports" class="nav-item">
                    <i class="bi bi-file-earmark-text"></i>
                    <span>Reports</span>
                </a>

                <a href="/settings" class="nav-item">
                    <i class="bi bi-gear"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </aside>

        <main class="main-area">
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-platform-title">DMCS Labs – AppSec Intelligence Platform</h1>
                    <p class="page-platform-subtitle">Enterprise Application Security Risk & Compliance Decisioning</p>
                </div>

                <div class="topbar-right">
                    <select class="env-selector">
                        <option>Prod</option>
                        <option>Dev</option>
                        <option>Staging</option>
                    </select>

                    <div class="search-box">
                        <i class="bi bi-search"></i>
                        <input type="text" placeholder="Search assets, findings, CVEs">
                    </div>

                    <button class="icon-btn">
                        <i class="bi bi-bell"></i>
                    </button>

                    <div class="user-profile">
                        <div class="user-avatar">AS</div>
                        <div class="user-meta">
                            <div class="user-name">Anthony Saunders</div>
                            <div class="user-role">Product Security</div>
                        </div>
                    </div>
                </div>
            </header>

            <section class="content-area">
                {% block content %}{% endblock %}
            </section>
        </main>

    </div>

</body>
</html>
